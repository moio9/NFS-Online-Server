; Most Wanted Online and LAN client configuration.
[network]
enabled = true
; Change this one value for a normal local, LAN, or Internet deployment.
; Optional per-service *_host overrides remain supported by the client.
host = 127.0.0.1
bootstrap_port = 30921
lobby_port = 30920
control_port = 20923
control_alias_port = 13505
race_port = 20000

[lan]
; MW LAN target and injected browser entry.
host = 127.0.0.1
port = 9900
inject_server = true
server_name = MWONLINE
server_racers = 1
selected_host_hook = true
refresh_state = false

[patches]
enabled = true

[logging]
enabled = true
; Enable only while diagnosing race transport; it can generate large logs.
udp_trace = false
