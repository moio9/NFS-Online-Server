; Carbon uses FESL/Plasma rather than the U2/MW bootstrap/lobby router.
[network]
enabled = true
; Base host used by Plasma and Messenger. Service values below override it.
host = 127.0.0.1
plasma_host = 127.0.0.1
; NFSC uses its built-in FESL/Plasma TCP port 18210. This plugin does not override it.
messenger_host = 127.0.0.1
messenger_port = 13505
http_base = 80
platform = PC

[mad]
enabled = true
host = 127.0.0.1
port = 9000
force_all_ports = true

[content]
virus = true

[logging]
enabled = true
