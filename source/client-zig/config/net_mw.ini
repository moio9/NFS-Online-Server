; U2 and MW share the same Online service names.
[network]
enabled = true
; Base host used by every Online service. Per-service values below override it.
host = 127.1.1.0
bootstrap_host = 127.1.1.0
bootstrap_port = 30921
lobby_host = 127.1.1.0
lobby_port = 30920
control_host = 127.1.1.0
control_port = 20923
control_alias_host = 127.1.1.0
control_alias_port = 13505
race_host = 127.1.1.0
race_port = 20000

[lan]
enabled = true
; Base host used by every LAN service. Per-service values below override it.
host = 127.1.1.0
port = 9900
control_host = 127.1.1.0
control_port = 20923
control_alias_host = 127.1.1.0
control_alias_port = 13505
discovery_host = 127.1.1.0
discovery_port = 3658
discovery_mirror = true
inject_server = true
server_name = MWONLINE
server_racers = 1
selected_host_hook = true
refresh_state = false

[patches]
enabled = true

[logging]
enabled = true
; Diagnostic bootstrap lines are written to net_mw-trace-<pid>.log.
udp_trace = true
