; Underground 2 Online and LAN client configuration.
[network]
enabled = true
; Change this one value for a normal local, LAN, or Internet deployment.
; Optional per-service *_host overrides remain supported by the client.
host = 127.0.0.1
bootstrap_port = 20921
lobby_port = 20922
control_port = 20923
control_alias_port = 13505
race_port = 20000

[lan]
enabled = true
; Host is shared by all LAN services.
host = 127.0.0.1
port = 20922
inject_server = true

[patches]
enabled = true

[logging]
enabled = true
; Enable only while diagnosing race transport; it can generate large logs.
udp_trace = false
