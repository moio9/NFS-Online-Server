; U2 and MW share the same Online service names.
[network]
enabled = true
; Base host used by every Online service. Per-service values below override it.
host = 127.1.1.0
bootstrap_host = 127.1.1.0
bootstrap_port = 20921
lobby_host = 127.1.1.0
lobby_port = 20922
control_host = 127.1.1.0
control_port = 20923
control_alias_host = 127.1.1.0
control_alias_port = 13505
race_host = 127.1.1.0
race_port = 20000

[lan]
enabled = true
; Host is shared by all LAN services.
host = 127.1.1.0
port = 20922
inject_server = true

[patches]
enabled = true

[logging]
enabled = true
; Diagnostic lifecycle/handshake lines are written to net_u2-trace-<pid>.log.
udp_trace = true
